plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'jacoco'
}

// Version, base repositories, gametest/datagen wiring, JaCoCo + jacocoMergedReport, datagen
// idempotence, and packaging excludes: hub-owned, synced verbatim (see mc-gradle-builds).
apply from: 'gradle/concord-common.gradle'

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    // Fabric
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Client source set
    "clientImplementation"("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    // ModMenu + Cloth Config — optional config-screen integration, compile-only against
    // their APIs and present in the dev client, never bundled. The modmenu entrypoint is
    // only invoked when ModMenu is installed; the Cloth screen builder is guarded on
    // isModLoaded so a missing Cloth Config costs nothing.
    modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
    modLocalRuntime "maven.modrinth:modmenu:${project.modmenu_version}"

    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    // Jade — no api split is published; compile-only links the full jar but only the
    // snownee.jade.api surface is referenced. Full jar in the dev client so the
    // Chronometer line can be eyeballed in-game.
    modCompileOnly "maven.modrinth:jade:${project.jade_version}"
    modLocalRuntime "maven.modrinth:jade:${project.jade_version}"

    // WTHIT — compile against the API split only; discovered via waila_plugins.json at
    // runtime. No modLocalRuntime: Jade is the probe in the dev client, and two probe
    // overlays loaded together double-render the same box.
    modCompileOnly "mcp.mobius.waila:wthit-api:${project.wthit_version}"

    // Tests
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.junit.jupiter:junit-jupiter-params"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // Knot-based classloader that boots Fabric before tests run — registries,
    // item registrations, and onInitialize are available without Bootstrap.bootStrap().
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
    // GametestRegistrationTest reads the gametest source tree, because the gametest
    // source set is not on the test classpath and its classes cannot be enumerated
    // from there. Gradle therefore sees no dependency between the two — without this
    // block the guard reports UP-TO-DATE exactly when registration has drifted, which
    // is the one moment it exists to fire. The shipped manifest is listed because the
    // guard's fourth assertion reads it; it also arrives transitively through
    // processResources, so it is not a live staleness hole, but declaring all three
    // keeps the block readable as "what this guard reads".
    //
    // The cost is that any edit under src/gametest/java invalidates the whole test
    // task, so the full Tier-1 suite reruns. That is the price of a guard that reads a
    // source tree Gradle otherwise has no reason to watch. Every other Tier-1 guard
    // reads its resources off the classpath instead and gets its tracking for free.
    inputs.files(fileTree('src/gametest/java'),
                 file('src/gametest/resources/fabric.mod.json'),
                 file('src/main/resources/fabric.mod.json'))
            .withPropertyName('gametestRegistration')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // The .sfx specs are committed build sources, not shipped resources — art/ is on
    // no classpath, so TimeLapseResourceContractTest's repeatability check cannot read
    // them the way every other guard reads its input. Declared for the same reason as
    // the block above: without it, deleting a .sfx source leaves the check UP-TO-DATE.
    inputs.files(fileTree('art/audio'))
            .withPropertyName('committedSfxSources')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
